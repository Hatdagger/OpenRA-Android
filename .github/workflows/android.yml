name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf zip
          dotnet workload install android

      - name: Cache native libraries and SDL Java sources
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            android/OpenRA.Android/libs
            android/OpenRA.Android/java/org
          key: natives-v2-${{ hashFiles('android/native/**') }}

      - name: Build native libraries
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          bash android/native/build-natives.sh arm64-v8a
          bash android/native/build-natives.sh x86_64

      - name: Package engine data
        run: bash android/package-engine.sh

      - name: Install Android SDK dependencies
        run: |
          dotnet build android/OpenRA.Android/OpenRA.Android.csproj -t:InstallAndroidDependencies \
            -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AcceptAndroidSDKLicenses=True

      - name: Build APK
        run: |
          dotnet publish android/OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Collect APK
        run: |
          mkdir -p out
          find android/OpenRA.Android/bin/Release -name '*-Signed.apk' -exec cp {} out/OpenRA-Android.apk \;
          ls -la out
          unzip -l out/OpenRA-Android.apk | grep -E 'lib/|assets/' || true

      - name: Build x86_64 APK (emulator smoke test only)
        run: |
          rm -rf android/OpenRA.Android/bin/Release
          dotnet publish android/OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android \
            -p:OpenRAAndroidRid=android-x64 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          mkdir -p out-x64
          find android/OpenRA.Android/bin/Release -name '*-Signed.apk' -exec cp {} out-x64/OpenRA-Android.apk \;
          unzip -l out-x64/OpenRA-Android.apk | grep 'lib/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRA-Android-x86_64-apk
          path: out-x64/OpenRA-Android.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRA-Android-apk
          path: out/OpenRA-Android.apk
          if-no-files-found: error

      - name: Publish to the "nightly" release (download this on the tablet)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly build" \
              --notes "Latest build of main. Install OpenRA-Android.apk on an arm64 Android 7+ device."
          gh release upload nightly out/OpenRA-Android.apk --clobber
          gh release edit nightly --notes "Latest build of main ($(git rev-parse --short HEAD), $(date -u +%Y-%m-%d)). Install OpenRA-Android.apk on an arm64 Android 7+ device."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  smoke-test:
    # Boots the APK in an emulator, then pushes screenshots + logcat to the
    # "smoke-test" branch so the results can be read without downloading artifacts.
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OpenRA-Android-x86_64-apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/smoke-test.sh

      - name: Push results to the smoke-test branch
        if: always()
        run: |
          [ -d smoke ] || exit 0
          SHA=$(git rev-parse --short HEAD)
          cd smoke
          git init -q -b smoke-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test results for $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-test
